<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Zalando Lounge — AI Shopping Assistant Demo</title>
    <link rel="stylesheet" href="styles.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
</head>
<body>

<!-- ===== Header ===== -->
<header class="header">
    <div class="header-inner">
        <a href="#" class="logo" onclick="showCampaigns(); return false;">
            <span class="logo-zalando">ZALANDO</span>
            <span class="logo-lounge">LOUNGE</span>
        </a>
        <nav class="nav">
            <a href="#" class="nav-link active">Damen</a>
            <a href="#" class="nav-link">Herren</a>
            <a href="#" class="nav-link">Kinder</a>
            <a href="#" class="nav-link">Home &amp; Living</a>
        </nav>
        <div class="header-actions">
            <button class="header-icon" title="Suche">
                <svg width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.8" viewBox="0 0 24 24"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/></svg>
            </button>
            <button class="header-icon" title="Wunschliste">
                <svg width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.8" viewBox="0 0 24 24"><path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"/></svg>
            </button>
            <button class="header-icon cart-icon" title="Warenkorb">
                <svg width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.8" viewBox="0 0 24 24"><path d="M6 2 3 6v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V6l-3-4z"/><line x1="3" y1="6" x2="21" y2="6"/><path d="M16 10a4 4 0 0 1-8 0"/></svg>
                <span class="cart-count">2</span>
            </button>
            <button class="header-icon" title="Mein Konto">
                <svg width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.8" viewBox="0 0 24 24"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
            </button>
        </div>
    </div>
</header>

<!-- ===== Sub-nav tabs ===== -->
<div class="sub-nav">
    <div class="sub-nav-inner">
        <a href="#" class="sub-nav-link active">Alle Aktionen</a>
        <a href="#" class="sub-nav-link">Schuhe</a>
        <a href="#" class="sub-nav-link">Bekleidung</a>
        <a href="#" class="sub-nav-link">Accessoires</a>
        <a href="#" class="sub-nav-link">Sport</a>
        <a href="#" class="sub-nav-link">Premium</a>
        <a href="#" class="sub-nav-link">Beauty</a>
    </div>
</div>

<!-- ===== Main: Campaigns view ===== -->
<main class="main" id="mainCampaigns">
    <!-- Sections injected by JS -->
</main>

<!-- ===== Main: Campaign detail (products) ===== -->
<main class="main hidden" id="mainProducts">
    <div class="product-view-header" id="productViewHeader">
        <!-- Injected by JS -->
    </div>
    <div class="product-filters" id="productFilters">
        <button class="filter-chip active">Alle</button>
        <button class="filter-chip">Kleider</button>
        <button class="filter-chip">Oberteile</button>
        <button class="filter-chip">Hosen</button>
        <button class="filter-chip">Schuhe</button>
        <button class="filter-chip">Accessoires</button>
    </div>
    <div class="product-grid" id="productGrid">
        <!-- Injected by JS -->
    </div>
</main>

<!-- ===== AI FAB ===== -->
<button class="ai-fab" id="aiFab" title="AI Shopping Assistant">
    <svg width="24" height="24" fill="none" stroke="currentColor" stroke-width="1.8" viewBox="0 0 24 24">
        <path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/>
        <path d="M8 10h.01M12 10h.01M16 10h.01" stroke-width="2.5" stroke-linecap="round"/>
    </svg>
    <span class="fab-badge">AI</span>
    <span class="fab-ring"></span>
</button>

<!-- ===== AI Chat Panel ===== -->
<div class="ai-panel" id="aiPanel">
    <div class="ai-header">
        <div class="ai-header-info">
            <div class="ai-header-avatar">
                <svg width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.8" viewBox="0 0 24 24">
                    <path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/>
                </svg>
            </div>
            <div>
                <div class="ai-header-title">Lounge AI Assistant</div>
                <div class="ai-header-subtitle">Immer für dich da</div>
            </div>
        </div>
        <button class="ai-header-close" id="aiClose">
            <svg width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
        </button>
    </div>
    <div class="ai-body" id="aiMessages">
        <!-- Messages injected by JS -->
    </div>
    <div class="ai-suggestions" id="quickActions">
        <button class="ai-chip" data-prompt="Finde mir ein schwarzes Kleid für eine Cocktailparty unter 80€">Schwarzes Kleid für Party</button>
        <button class="ai-chip" data-prompt="Welche Größe passt mir? Ich trage normalerweise EU 38">Größenberatung</button>
        <button class="ai-chip" data-prompt="Zeig mir trendige Sneaker im Sale">Sneaker im Sale</button>
        <button class="ai-chip" data-prompt="Wo ist meine Bestellung?">Bestellung verfolgen</button>
        <button class="ai-chip" data-prompt="Stelle mir ein Outfit für ein Vorstellungsgespräch zusammen">Outfit-Beratung</button>
    </div>
    <div class="ai-input-bar">
        <input type="text" id="aiInput" placeholder="Frag mich etwas..." autocomplete="off">
        <button class="ai-send-btn" id="aiSend">
            <svg width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="m22 2-7 20-4-9-9-4 20-7z"/><path d="m22 2-10 10"/></svg>
        </button>
    </div>
</div>

<!-- ===== Product Quick View Modal ===== -->
<div class="overlay" id="modalOverlay">
    <div class="modal" id="productModal">
        <button class="modal-close" id="modalClose">
            <svg width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
        </button>
        <div class="modal-body" id="modalBody"></div>
    </div>
</div>

<script src="app.js"></script>
</body>
</html>
